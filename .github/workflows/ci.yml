name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # shell: powershell is Windows PowerShell 5.1, the version friends' PCs have
      - name: Tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Run-Tests.ps1
      # Windows PowerShell 5.1 reads BOM-less UTF-8 as ANSI and mangles anything non-ASCII
      - name: Scripts stay ASCII
        shell: powershell
        run: |
          $bad = Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.bat, *.json, *.txt |
            Where-Object { @([IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 }).Count -gt 0 }
          if ($bad) { $bad | ForEach-Object { "non-ASCII: $($_.FullName)" }; exit 1 }
